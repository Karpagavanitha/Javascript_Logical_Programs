<script>
    var n=prompt(parseInt("enter the number"))
    var c=0
    var i=1
    while(i<=n){
      
        if(n%i==0){
            c++
        }
        i++
    }
    
    //document.write(c)
    if(c==2){
        document.write("prime")
    }
    else{
        document.write("not prime")
    }
</script>
