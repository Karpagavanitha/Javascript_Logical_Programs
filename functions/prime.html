<script>
    let n=parseInt(prompt("enter the number"))
    let count=0
    function prime(){
        for(let i=1;i<=n;i++){
            if(n%i==0){
              count++
            }
        }
        if(count==2){
            document.write("prime")
        }
        else{
            document.write("not prime")
        }
    }
    prime()
</script>
