<script>
    for(let i=1;i<=100;i++){
        let num=i
        let rev=0
        let pali=num
        while(num>0){
            let rem=num%10
            rev=(rev*10)+rem
            num=parseInt(num/10)
        }
        if(pali==rev){
            document.write("palindrome "+rev+"<br>")
        }

    }
</script>
