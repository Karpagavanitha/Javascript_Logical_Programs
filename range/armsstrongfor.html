<script>
    for(let i=1;i<=100;i++){
        let num=i
        let sum=0
        let arm=i
        while(num>0){
            let rem=num%10
            sum=sum+(rem*rem*rem)
            num=parseInt(num/10)
        }
        if(arm==sum){
          document.write(arm+"<br> armstrong number")
        }
    }
</script>
