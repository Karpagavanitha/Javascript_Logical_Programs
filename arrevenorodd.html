<script>
    let size=parseInt(prompt("enter the size of the array"))
    let a=[]
    for(let i=0;i<size;i++){
        a[i]=parseInt(prompt("Enter the number"))
    }
    for(var i=0;i<a.length;i++){
        var n=a[i]
        if(n%2==0){
            document.write("even <br>")
        }
        else{
            document.write("odd <br>")
        }
    }
</script>
