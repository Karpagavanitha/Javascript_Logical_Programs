<script>
    var sum=0,pro=1
    var n=parseInt(prompt("Enter any number"))
    while(n>0){
        var rem=n%10
        sum=sum+rem
        pro=pro*rem
        n=parseInt(n/10)
    }
    if(sum==pro){
        document.write("spy number")
    }
    else{
        document.write("not spy number")
    }
</script>
